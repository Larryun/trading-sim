name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      # Kept in a separate workflow from the deploy on purpose: the simulation tests are
      # statistical (the engine uses Math.random), so a rare flake should surface here rather
      # than block publishing the site.
      - run: npm test
